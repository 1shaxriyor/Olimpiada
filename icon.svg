<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background with safe zone padding -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Subtle Circuit Lines -->
  <path d="M 80 140 H 180 L 220 180" stroke="#93c5fd" stroke-width="4" stroke-opacity="0.3" fill="none"/>
  <circle cx="80" cy="140" r="6" fill="#93c5fd" fill-opacity="0.5"/>
  <path d="M 432 140 H 332 L 292 180" stroke="#93c5fd" stroke-width="4" stroke-opacity="0.3" fill="none"/>
  <circle cx="432" cy="140" r="6" fill="#93c5fd" fill-opacity="0.5"/>
  
  <!-- Terminal/Screen Box -->
  <rect x="96" y="110" width="320" height="230" rx="24" fill="#0f172a" stroke="#60a5fa" stroke-width="4"/>
  <rect x="96" y="110" width="320" height="40" rx="24" fill="#1e293b"/>
  <!-- Window buttons -->
  <circle cx="126" cy="130" r="6" fill="#ef4444"/>
  <circle cx="146" cy="130" r="6" fill="#f59e0b"/>
  <circle cx="166" cy="130" r="6" fill="#10b981"/>
  
  <!-- Code snippet in screen -->
  <text x="126" y="185" font-family="monospace" font-size="20" font-weight="bold" fill="#38bdf8">&gt; informatik_olimpiada</text>
  <text x="126" y="215" font-family="monospace" font-size="16" fill="#94a3b8">class OlimpiadaTest:</text>
  <text x="146" y="240" font-family="monospace" font-size="16" fill="#4ade80">  score = 100%</text>
  <text x="146" y="265" font-family="monospace" font-size="16" fill="#f43f5e">  grade = 5</text>
  <text x="126" y="300" font-family="monospace" font-size="18" fill="#fbbf24">✓ TAYYORMISIZ? [9, 10, 11]</text>

  <!-- Trophy in foreground -->
  <g transform="translate(196, 270) scale(0.6)" filter="url(#glow)">
    <path d="M50 40 H150 V110 C150 155 110 180 100 180 C90 180 50 155 50 110 Z" fill="url(#gold)"/>
    <path d="M50 60 H20 C15 60 10 70 15 90 C20 110 40 120 50 120" stroke="url(#gold)" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M150 60 H180 C185 60 190 70 185 90 C180 110 160 120 150 120" stroke="url(#gold)" stroke-width="12" fill="none" stroke-linecap="round"/>
    <rect x="88" y="180" width="24" height="40" fill="url(#gold)"/>
    <rect x="60" y="220" width="80" height="25" rx="6" fill="#78350f"/>
    <!-- Star on trophy -->
    <polygon points="100,85 106,100 122,100 109,110 114,125 100,115 86,125 91,110 78,100 94,100" fill="#ffffff"/>
  </g>
</svg>
